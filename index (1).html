<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAZ | TOP SECRET</title>
<style>
:root{--bg:#04070a;--p:#09100f;--g:#39ff88;--gd:#1f9a52;--a:#ffb000;--r:#ff3b3b;--t:#b4f5cf;--m:#5d8a70;--line:#14382a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--t);font-family:ui-monospace,"Courier New",Consolas,monospace;line-height:1.7;background:radial-gradient(ellipse at 50% -10%,#0c2118,var(--bg) 65%) fixed;padding-bottom:30px}

.cls{background:var(--r);color:#000;text-align:center;font-weight:700;letter-spacing:5px;font-size:11px;padding:2px 0}

textarea{min-height:90px}
.btn{background:none;border:1px solid var(--g);color:var(--g);padding:9px 20px;cursor:pointer;font:inherit;letter-spacing:2px}
.btn:hover{background:var(--g);color:#000}
.btn.r{border-color:var(--r);color:var(--r)}.btn.r:hover{background:var(--r);color:#000}

.empty{text-align:center;color:var(--m);padding:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:70;padding:16px}
.mod{background:var(--p);border:1px solid var(--g);padding:20px;width:min(420px,100%);box-shadow:0 0 30px rgba(57,255,136,.2)}
.code{font-size:28px;letter-spacing:5px;text-align:center;color:var(--a);margin:12px 0;direction:ltr;text-shadow:0 0 10px #7a5400}
.gate{max-width:380px;margin:9vh auto;padding:0 16px;text-align:center}
.gate .logo{justify-content:center;font-size:42px}.gate .logo svg{width:70px;height:70px}
pre.boot{max-width:520px;margin:18vh auto;color:var(--g);direction:ltr;text-align:left;padding:0 16px;text-shadow:0 0 6px var(--gd)}
.blink::after{content:"█";animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--g);color:var(--g);padding:8px 20px;display:none;z-index:80}
@media (max-width:800px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap}}
</style>
</head>
<body>
<div class="cls">TOP SECRET // RAZ // سري للغاية</div>
<div id="root"></div>
<div class="cls b">INFORMATION IS POWER</div>
<div id="toast"></div>
<script>
const RANKS=[{c:"B-0",n:"القائد الأعلى",k:"B"},{c:"B-1",n:"النائب",k:"B"},{c:"F-1",n:"ضابط عمليات أول",k:"F"},{c:"F-2",n:"ضابط عمليات",k:"F"},{c:"F-3",n:"ضابط ميداني",k:"F"},{c:"S-1",n:"فرد أول",k:"S"},{c:"S-2",n:"فرد",k:"S"},{c:"S-3",n:"متدرب",k:"S"}];

function reveal(name,code,badge){const ov=h("div",{className:"ov"}),bx=h("div",{className:"mod"},h("h3",{textContent:"ACCESS CODE: "+name,style:"color:var(--a);margin-top:0"}),h("div",{className:"code",textContent:code}),

// ===== البوابة =====
function gate(){const r=$("root");r.textContent="";const first=!D.cmd;

  if(Date.now()<lock)return toast("محاولات كثيرة، انتظر 30 ثانية");
  if(first){if(v.replace(/[^A-Za-z0-9]/g,"").length<8)return toast("الرمز قصير جداً");D.cmd=await hash(v);save();me={code:"B-0",name:"القائد الأعلى",owner:true};return boot()}
  const ch=await hash(v);
  if(ch===D.cmd){me={code:"B-0",name:"القائد الأعلى",owner:true};return boot()}
  const m=D.members.find(x=>x.ch===ch);
  if(m){me=m;return boot()}
  if(++tries>=5){lock=Date.now()+30000;tries=0}toast("ACCESS DENIED")};

 r.append(h("div",{className:"gate"},logo(),h("p",{className:"muted blink",textContent:first?"SYSTEM NOT INITIALIZED":"AUTHENTICATION REQUIRED"}),inp,h("button",{className:"btn",style:"width:100%",textContent:first?"INITIALIZE":"AUTHENTICATE",onclick:go}),
  h("p",{className:"muted",textContent:first?"أول دخول: الرمز اللي تكتبه الحين يصير رمز القائد B-0. احفظه.":"الرمز يسلّمه لك القائد أو القيادة."})))}
async function boot(){const r=$("root");r.textContent="";const t=h("pre",{className:"boot"});r.append(t);
 for(const l of["> OPENING SESSION ...","> VERIFYING CREDENTIALS .... OK","> CLEARANCE LEVEL: "+me.code,"> LOADING DOSSIERS ....... OK","> ACCESS GRANTED"]){t.textContent+=l+"\n";await new Promise(x=>setTimeout(x,240))}
 await new Promise(x=>setTimeout(x,300));start()}

// ===== الواجهة =====
function start(){const r=$("root");r.textContent="";
 const tabs=[["dash","01","الرئيسية"],["decrees","02","القرارات"]];
 if(isLead())tabs.push(["members","03","الأعضاء"]);
 tabs.push(["reports","04",isLead()?"التقارير":"إرسال تقرير"],["verify","05","فحص بادج"]);
 if(isOwner())tabs.push(["cmd","06","لوحة القائد","gold"]);
 const nav=h("nav");tabs.forEach(([id,n,t,c])=>{const b=h("button",{textContent:"["+n+"] "+t,className:c||""});b.dataset.t=id;b.onclick=()=>{cur=id;view()};nav.append(b)});
 const clk=h("span",{className:"clock"});const tick=()=>clk.textContent=new Date().toISOString().replace("T"," ").slice(0,19)+" UTC";tick();setInterval(tick,1000);
 r.append(h("div",{className:"top"},logo(),h("span",{},clk," ",h("span",{className:"chip",textContent:me.owner?"B-0":me.code+" | "+me.name}),h("button",{className:"sm",textContent:"LOGOUT",onclick:()=>{me=null;gate()}}))),
  h("div",{id:"ban"}),h("div",{className:"app"},nav,h("main",{id:"main"})));view()}
function view(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===cur));
 const b=$("ban");b.textContent="";if(D.banner)b.append(h("div",{className:"ban",textContent:"⚠ "+D.banner}));
 const m=$("main");m.textContent="";m.append(V[cur]())}
const V={};

V.dash=()=>{const f=h("div");
 f.append(h("h2",{textContent:"DASHBOARD | لوحة المعلومات"}));
 const st=[["OPERATIVES",D.members.length+1],["DECREES",D.decrees.length]];if(isLead())st.push(["REPORTS",D.reports.length]);
 f.append(h("div",{className:"stats"},...st.map(([t,n])=>h("div",{className:"stat"},h("b",{textContent:n}),t))));
 const cnt={B:1,F:0,S:0};D.members.forEach(m=>{const r=info(m.code);if(r)cnt[r.k]++});const tot=D.members.length+1;
 f.append(h("div",{className:"grid2"},card("CADRE DISTRIBUTION",...Object.keys(CAD).map(k=>h("div",{className:"bar"},h("span",{textContent:k+" | "+CAD[k]}),h("div",{className:"trk"},h("i",{style:"width:"+(cnt[k]/tot*100)+"%"})),h("b",{textContent:cnt[k]})))),
  card("SYSTEM STATUS",...[["الاتصال","SECURE"],["مستوى التصريح",me.code],["الحالة","ACTIVE"]].map(([a,b])=>h("div",{className:"row"},h("span",{textContent:a}),h("b",{className:"ok",textContent:b}))))));

  h("span",{className:"stamp",textContent:"TOP SECRET"}),h("p",{className:"muted",textContent:"البادج وثيقة حصانة رسمية (المادة 4). القائد الأعلى يُكتفى برمزه B-0 فقط (المادة 1)."})));

  h("button",{className:"btn",textContent:"ISSUE",onclick:()=>{const t=$("dT").value.trim(),b=$("dB").value.trim();if(t.length<3||b.length<5)return toast("أكمل الحقول");D.decrees.unshift({id:Date.now(),title:t,body:b,ts:Date.now()});save();toast("تم الإصدار");view()}})));

V.members=()=>{const f=h("div",{},h("h2",{textContent:"PERSONNEL | الأعضاء"}));

 f.append(card("REGISTER OPERATIVE",n,s,h("button",{className:"btn",textContent:"REGISTER + ACCESS CODE",onclick:async()=>{
  const name=n.value.trim(),code=s.value;if(name.length<2)return toast("اكتب الاسم");
  if(code==="B-1"&&D.members.some(m=>m.code==="B-1"))return toast("النائب معيّن مسبقاً");
  let badge;do{badge="RAZ-"+Math.floor(1000+Math.random()*9000)}while(D.members.some(m=>m.badge===badge));
  const c=genCode();D.members.push({id:Date.now(),name,code,badge,ch:await hash(c),ts:Date.now()});save();reveal(name,c,badge);view()}})));
 const l=card("PERSONNEL FILE");l.append(h("div",{className:"row"},h("span",{},h("span",{className:"tag",textContent:"B-0"}),"B-0"),h("span",{className:"muted",textContent:"القائد الأعلى"})));
 if(!D.members.length)l.append(empty("NO OPERATIVES"));

  const i=RANKS.findIndex(r=>r.c===m.code),manage=isOwner()||info(m.code).k!=="B";
  const mv=d=>{const x=RANKS[i+d];if(!x||x.c==="B-0"||(!isOwner()&&x.k==="B")||(x.c==="B-1"&&D.members.some(y=>y.code==="B-1")))return toast("غير مسموح");m.code=x.c;save();view()};
  const r=h("div",{className:"row"},h("span",{},h("span",{className:"tag",textContent:m.code}),h("b",{textContent:label(m)}),h("div",{className:"muted",textContent:m.badge+" | "+CAD[info(m.code).k]})));
  if(manage)r.append(h("span",{},h("button",{className:"sm",textContent:"▲",onclick:()=>mv(-1)}),h("button",{className:"sm",textContent:"▼",onclick:()=>mv(1)}),
   h("button",{className:"sm",textContent:"🔑",onclick:async()=>{const c=genCode();m.ch=await hash(c);save();reveal(m.name,c,m.badge)}}),
   h("button",{className:"sm",textContent:"فصل",onclick:()=>{if(confirm("فصل "+m.name+"؟")){D.members=D.members.filter(x=>x!==m);save();view()}}})));
  l.append(r)});
 f.append(l);return f};

V.reports=()=>{const f=h("div",{},h("h2",{textContent:"REPORTS | التقارير"}));
 const t=h("input",{placeholder:"العنوان",maxLength:80}),b=h("textarea",{placeholder:"التفاصيل",maxLength:1000});
 f.append(card("FILE NEW REPORT",t,b,h("button",{className:"btn",textContent:"SUBMIT",onclick:()=>{if(t.value.trim().length<3||b.value.trim().length<10)return toast("التقرير قصير");
  D.reports.unshift({id:Date.now(),title:t.value.trim(),body:b.value.trim(),by:me.code,ts:Date.now()});save();toast("تم الإرسال للقيادة");t.value=b.value="";if(isLead())view()}})));
 if(isLead()){const l=card("INBOX");if(!D.reports.length)l.append(empty("NO REPORTS"));
  D.reports.forEach(r=>l.append(h("div",{className:"row"},h("div",{},h("b",{textContent:r.title}),h("div",{className:"muted",textContent:r.by+" | "+date(r.ts)}),h("div",{textContent:r.body})),
   h("button",{className:"sm",textContent:"أرشفة",onclick:()=>{D.reports=D.reports.filter(x=>x!==r);save();view()}}))));f.append(l)}

V.verify=()=>{const f=h("div",{},h("h2",{textContent:"BADGE CHECK | فحص البادج"}));const i=h("input",{placeholder:"RAZ-1234",dir:"ltr"}),o=h("p");
 f.append(card("VERIFY",i,h("button",{className:"btn",textContent:"VERIFY",onclick:()=>{const m=D.members.find(x=>x.badge===i.value.trim().toUpperCase());
  if(!m){o.className="bad";o.textContent="✖ INVALID BADGE";return}o.className="ok";o.textContent="✔ VALID | "+m.code+" | "+CAD[info(m.code).k]+" | حصانة الوكالة سارية (المادة 4)"}}),o));return f};

V.cmd=()=>{const f=h("div",{},h("h2",{textContent:"COMMAND PANEL | لوحة القائد"}));
 const bi=h("input",{placeholder:"نص الإعلان العاجل",maxLength:140,value:D.banner||""});
 f.append(card("URGENT BROADCAST",bi,h("button",{className:"btn",textContent:"BROADCAST",onclick:()=>{D.banner=bi.value.trim();save();toast("تم");view()}}),h("button",{className:"sm",textContent:"إزالة",onclick:()=>{D.banner="";save();view()}})));
 const st=h("input",{placeholder:"عنوان الملف",maxLength:80}),sb=h("textarea",{placeholder:"المحتوى",maxLength:2000});
